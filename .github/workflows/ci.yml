name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-tokens.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:electron
      - run: npm run build:frontend:web
      - run: npm run build:frontend:platform
      - run: npm run build:frontend:electron

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            test-results/
            tests/ui/__screenshots__/
          if-no-files-found: ignore
